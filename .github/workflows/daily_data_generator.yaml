# name of the workflow, shows up in GitHub Actions tab
name: Daily Data Generator

# when to trigger the workflow
on:
  schedule:
    # cron format: minute hour day month weekday
    # '0 14 * * *' means every day at 11:40PM UTC (6:40PM EST)
    - cron: '40 23 * * *'

# defines the jobs to run
jobs:
  generate:
    # runs on a fresh Ubuntu virtual machine hosted by GitHub
    runs-on: ubuntu-latest
    steps:
      # checks out your repo code onto the virtual machine
      - uses: actions/checkout@v4
      
      # installs Python 3.10 on the virtual machine
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      # installs all Python packages from requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      # injects DATABASE_URL secret as environment variable and runs data_generator.py
      - name: Run data generator
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python3 data_generator.py
